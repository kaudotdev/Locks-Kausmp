plugins {
	id 'net.neoforged.moddev' version '2.0.28-beta'
	id 'maven-publish'
}

base.archivesName = "${mod_name}-neoforge"
version = "${mod_version}"

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

neoForge {
	version = project.neoforge_version
	
	parchment {
		minecraftVersion = project.minecraft_version
		mappingsVersion = project.parchment_mappings
	}
	
	mods {
		locks {
			sourceSet sourceSets.main
		}
	}
	
	runs {
		client {
			client()
		}
		server {
			server()
		}
		data {
			data()
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').getAbsolutePath(), '--existing', file('src/main/resources').getAbsolutePath()
		}
	}
	
	accessTransformers {
		file('src/main/resources/META-INF/accesstransformer.cfg')
	}
}

repositories {
	maven {
		url = "https://www.cursemaven.com"
		content {
			includeGroup("curse.maven")
		}
	}
}

dependencies {
	// Optional mod dependencies (commented out for now until compatible versions are available)
	// compileOnly("curse.maven:lootr-361276:XXX")
	// compileOnly("curse.maven:dungeon-crawl-324973:XXX")
}

tasks.named('processResources', ProcessResources).configure {
	var replaceProperties = [
			minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
			neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
			loader_version_range: loader_version_range,
			mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
			mod_author: mod_author, mod_description: mod_description, mod_icon: mod_icon, credits: credits
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
		expand replaceProperties + [project: project]
	}}

tasks.named('jar', Jar).configure {
	manifest {
		attributes([
				"Specification-Title": mod_name,
				"Specification-Vendor": mod_author,
				"Specification-Version": "1", // We are version 1 of ourselves
				"Implementation-Title": project.name,
				"Implementation-Version": project.jar.archiveVersion,
				"Implementation-Vendor": mod_author,
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
	options.release = 21
}